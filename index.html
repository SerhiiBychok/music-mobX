<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#166534">
<title>Щоденник залу — руки і спина</title>
<style>
:root {
  --bg: #0c140f; --surface: #132019; --surface-2: #1b2d22; --line: #284234;
  --text: #eef5ee; --muted: #93a89a; --accent: #4ade80; --on-accent: #052e14;
  --hero-1: #14532d; --hero-2: #15803d; --hero-mark: #86efac;
  --back: #5eead4; --biceps: #fcd34d; --triceps: #fda4af; --danger: #ff7b7b;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #edf5ee; --surface: #ffffff; --surface-2: #e1efe3; --line: #c9dfcd;
    --text: #10201a; --muted: #56695d; --accent: #15803d; --on-accent: #ffffff;
    --hero-1: #166534; --hero-2: #16a34a; --hero-mark: #bbf7d0;
    --back: #0f766e; --biceps: #92600a; --triceps: #b3312f; --danger: #c22f2f;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(150px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 0; }

header { background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); color: #fff; border-radius: 0 0 22px 22px; }
header > div { max-width: 640px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px 20px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.78); }
h1 { font-size: 30px; line-height: 1.1; margin: 4px 0 0; letter-spacing: -.02em; font-weight: 800; }
h1 span { color: var(--hero-mark); }
.progress { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.progress-label { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin: 6px 0 16px; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
.card.done { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.card-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; text-align: left; }
.num { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.card.done .num { background: var(--accent); color: var(--on-accent); }
.card-title { flex: 1; min-width: 0; }
.card-title b { display: block; font-size: 17px; line-height: 1.25; margin-bottom: 2px; }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.chip { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.chip.back { color: var(--back); } .chip.biceps { color: var(--biceps); } .chip.triceps { color: var(--triceps); }
.target { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent); }
.card-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }

.sets { margin-top: 12px; }
.set { display: grid; grid-template-columns: 28px 1fr 1fr 48px; gap: 8px; align-items: center; margin-bottom: 8px; }
.set-n { color: var(--muted); font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; }
.field { position: relative; }
.field input {
  width: 100%; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--text); font: 600 18px/1 inherit; font-family: inherit; padding: 0 44px 0 12px; font-variant-numeric: tabular-nums;
}
.field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; }
.check { height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; color: var(--muted); }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.set-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ghost { font-size: 14px; color: var(--muted); padding: 8px 10px; border: 1px dashed var(--line); border-radius: 8px; }
.last { font-size: 13px; color: var(--muted); margin: 12px 0 0; }

details { margin-top: 12px; border-radius: 10px; background: var(--surface-2); }
summary { padding: 11px 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
.how { padding: 0 12px 12px; font-size: 14.5px; }
.how ol, .how ul { margin: 6px 0 10px; padding-left: 20px; }
.how li { margin-bottom: 4px; }
.how li::marker { color: var(--accent); font-weight: 700; }
.how h4 { margin: 10px 0 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.how a { color: var(--accent); font-weight: 600; }
.how p { margin: 6px 0; }

.btn { display: block; width: 100%; padding: 15px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 16px; margin-top: 16px; }
.btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }

h2 { font-size: 20px; margin: 22px 0 10px; letter-spacing: -.01em; }
h2:first-child { margin-top: 4px; }
.prose { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 14px; padding: 4px 16px 10px; margin-bottom: 10px; }
.prose h3 { font-size: 15px; margin: 14px 0 4px; }
.prose p, .prose ul { margin: 4px 0 8px; font-size: 15px; color: var(--text); }
.prose ul { padding-left: 20px; }
.prose li::marker { color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 48px 16px; }
.h-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
.h-row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; flex: none; max-width: 55%; }
.h-stats { color: var(--muted); font-size: 13px; }
.link-danger { color: var(--danger); font-size: 13px; padding: 8px 0 4px; }

nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav button { padding: 14px 0; font-size: 14px; font-weight: 600; color: var(--muted); border-top: 3px solid transparent; margin-top: -1px; }
nav button[aria-current="true"] { color: var(--accent); border-top-color: var(--accent); }

.timer { position: fixed; left: 12px; right: 12px; bottom: calc(60px + env(safe-area-inset-bottom)); max-width: 616px; margin: 0 auto; z-index: 6;
  background: linear-gradient(135deg, var(--hero-1), var(--hero-2)); color: #fff; border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.timer[hidden] { display: none; }
.timer small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.timer strong { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1; }
.timer .grow { flex: 1; }
.timer button { padding: 10px 12px; border-radius: 9px; font-weight: 700; font-size: 14px; color: #fff; border: 1px solid rgba(255,255,255,.4); }
.timer.up { background: var(--accent); color: var(--on-accent); }
.timer.up button { color: var(--on-accent); border-color: color-mix(in srgb, var(--on-accent) 40%, transparent); }
</style>
</head>
<body>
<header><div>
  <div class="eyebrow" id="dateLabel"></div>
  <h1>Руки <span>і</span> спина</h1>
</div></header>
<main id="app"></main>

<div class="timer" id="timer" hidden>
  <div class="grow"><small id="timerLabel">Відпочинок</small><strong id="timerTime">1:15</strong></div>
  <button data-act="timer-add">+15 с</button>
  <button data-act="timer-skip">Пропустити</button>
</div>

<nav><div>
  <button data-tab="workout">Тренування</button>
  <button data-tab="guide">Поради</button>
  <button data-tab="history">Історія</button>
</div></nav>

<script>
const REST_SECONDS = 75;
const GROUPS = { back: 'Спина', biceps: 'Біцепс', triceps: 'Трицепс' };
const PLAN = [
  { id: 'lat-pulldown', en: 'Lat pulldown', name: 'Тяга верхнього блока до грудей', group: 'back', sets: 3, reps: '10–12', equip: 'Блочний тренажер, широка рукоять',
    start: 'Спробуй 20–30 кг і підкоригуй.',
    steps: ['Сядь і зафіксуй стегна під валиками. Візьмися за рукоять трохи ширше плечей, долонями від себе.',
            'Трохи відхилися назад, груди вперед.',
            'Тягни рукоять до верхньої частини грудей, ведучи лікті вниз до стегон.',
            'Затримайся на секунду, потім повільно відпусти рукоять угору, доки руки не випрямляться.'],
    cues: ['Уявляй, що ховаєш лікті в задні кишені — працює спина, а не кисті.', 'Плечі опущені, подалі від вух.'],
    mistake: 'Розгойдувати корпус, щоб смикнути вагу, або тягнути рукоять за голову.' },
  { id: 'seated-row', en: 'Seated cable row', name: 'Тяга нижнього блока до пояса сидячи', group: 'back', sets: 3, reps: '10–12', equip: 'Тренажер для горизонтальної тяги, V-рукоять',
    start: 'Спробуй 20–30 кг і підкоригуй.',
    steps: ['Сядь, уприся ступнями в платформу, коліна трохи зігнуті, спина рівна.',
            'Візьми рукоять прямими руками й випрямся.',
            'Тягни рукоять до пупка, зводячи лопатки разом.',
            'Повільно повертайся, доки руки не випрямляться, не округлюючи спину.'],
    cues: ['Груди розгорнуті весь час.', 'Лікті ковзають уздовж ребер.'],
    mistake: 'Гойдатися всім тілом уперед-назад — корпус має майже не рухатися.' },
  { id: 'db-row', en: 'One-arm dumbbell row', name: 'Тяга гантелі однією рукою в нахилі', group: 'back', sets: 3, reps: '10 на бік', equip: 'Гантель і горизонтальна лава',
    start: 'Спробуй гантель 8–12 кг.',
    steps: ['Постав ліве коліно й ліву долоню на лаву. Спина рівна, як стіл, права нога на підлозі.',
            'Візьми гантель у праву руку, рука звисає прямо вниз.',
            'Тягни гантель до стегна, лікоть проходить уздовж ребер.',
            'Опусти під контролем. Зроби всі повтори й поміняй бік.'],
    cues: ['Тягни ліктем, а не кистю.', 'Таз і плечі паралельні підлозі.'],
    mistake: 'Розвертати корпус, щоб підняти вагу, або округлювати поперек.' },
  { id: 'db-curl', en: 'Dumbbell biceps curl', name: 'Згинання рук з гантелями на біцепс', group: 'biceps', sets: 3, reps: '10–12', equip: 'Дві гантелі',
    start: 'Спробуй 5–8 кг на кожну руку.',
    steps: ['Стань рівно, гантелі в руках, долоні вперед, лікті притиснуті до боків.',
            'Зігни руки, піднімаючи гантелі до плечей, не рухаючи плечовою частиною руки.',
            'Напруж біцепс угорі на секунду.',
            'Опускай повільно, 2–3 секунди, до повного випрямлення рук.'],
    cues: ['Лікті притиснуті до ребер.', 'Повільне опускання дає найбільше користі.'],
    mistake: 'Розгойдуватися чи відхилятися назад, щоб закинути вагу. Якщо так виходить — візьми легші гантелі.' },
  { id: 'pushdown', en: 'Triceps rope pushdown', name: 'Розгинання рук на блоці з канатом', group: 'triceps', sets: 3, reps: '10–12', equip: 'Блочний тренажер, канат на верхньому блоці',
    start: 'Спробуй 10–15 кг і підкоригуй.',
    steps: ['Стань обличчям до блока, візьми канат обома руками, зроби крок назад і трохи нахилися вперед.',
            'Притисни лікті до боків, передпліччя приблизно паралельні підлозі.',
            'Тисни канат униз до повного випрямлення рук, унизу розводь кінці каната в сторони.',
            'Повільно повертайся в початкове положення. Рухаються тільки передпліччя.'],
    cues: ['Лікті — це шарнір, вони не зсуваються з місця.', 'Повністю випрямляй руки в кожному повторі.'],
    mistake: 'Розводити лікті або виносити їх уперед — тоді тисне все тіло, а не трицепс.' },
  { id: 'hammer-curl', en: 'Hammer curl', name: 'Згинання рук «молоток»', group: 'biceps', sets: 2, reps: '12', equip: 'Дві гантелі',
    start: 'Та сама вага, що й на згинаннях, або трохи більша.',
    steps: ['Стань рівно, гантелі з боків, долоні дивляться одна на одну (ніби тримаєш молоток).',
            'Зігни руки, зберігаючи цей хват на всьому шляху.',
            'Повільно опусти до повного випрямлення.'],
    cues: ['Великі пальці весь час дивляться вгору.', 'Навантажує передпліччя й зовнішню частину руки.'],
    mistake: 'Розвертати кисті, як у звичайному згинанні, або розгойдувати корпус.' },
  { id: 'oh-extension', en: 'Overhead dumbbell triceps extension', name: 'Розгинання рук з гантеллю з-за голови', group: 'triceps', sets: 2, reps: '12', equip: 'Одна гантель, сидячи',
    start: 'Спробуй одну гантель 6–10 кг двома руками.',
    steps: ['Сядь на лаву зі спинкою. Візьми одну гантель обома руками й підніми над головою.',
            'Тримаючи плечі біля вух, зігни лікті й опусти гантель за голову.',
            'Випрями руки, піднімаючи гантель назад угору.'],
    cues: ['Лікті дивляться вперед, а не в сторони.', 'Ребра опущені — не прогинай поперек.'],
    mistake: 'Брати завелику вагу. Вправа розтягує ліктьовий суглоб, тож починай легко й під контролем.' },
];

// ---------- state ----------
const KEY = 'gymlog.v1';
let state = load();
let tab = 'workout';
let openId = null;

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.history) return s; } catch (e) {}
  return { current: null, history: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function lastSets(exId) {
  for (const s of state.history) {
    const done = (s.entries[exId] || []).filter(x => x.done);
    if (done.length) return { date: s.date, sets: done };
  }
  return null;
}
function ensureCurrent() {
  if (state.current) return state.current;
  const entries = {};
  for (const ex of PLAN) {
    const prev = lastSets(ex.id);
    entries[ex.id] = Array.from({ length: ex.sets }, (_, i) => ({
      kg: prev ? (prev.sets[Math.min(i, prev.sets.length - 1)].kg ?? '') : '', reps: '', done: false }));
  }
  state.current = { startedAt: null, entries };
  return state.current;
}
const fmtKg = v => (v === '' || v == null) ? '–' : String(v);
const fmtDate = iso => new Date(iso).toLocaleDateString('uk-UA', { weekday: 'short', day: 'numeric', month: 'short' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const setsText = sets => sets.map(s => `${fmtKg(s.kg)}×${s.reps || '–'}`).join(', ');
// Ukrainian plural: 1 підхід, 2 підходи, 5 підходів
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
}

// ---------- render ----------
const app = document.getElementById('app');
function render() {
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab));
  document.getElementById('dateLabel').textContent =
    new Date().toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' }) + ' · для початківців';
  app.innerHTML = tab === 'workout' ? workoutView() : tab === 'guide' ? guideView() : historyView();
}

function workoutView() {
  const cur = ensureCurrent();
  let total = 0, done = 0;
  for (const ex of PLAN) for (const s of cur.entries[ex.id]) { total++; if (s.done) done++; }
  if (openId === null) openId = (PLAN.find(ex => cur.entries[ex.id].some(s => !s.done)) || PLAN[0]).id;

  const cards = PLAN.map((ex, i) => {
    const sets = cur.entries[ex.id];
    const allDone = sets.length > 0 && sets.every(s => s.done);
    const open = openId === ex.id;
    const prev = lastSets(ex.id);
    const q = encodeURIComponent(ex.en + ' proper form beginner');
    return `<section class="card ${allDone ? 'done' : ''}">
      <button class="card-head" data-act="toggle" data-ex="${ex.id}" aria-expanded="${open}">
        <span class="num">${allDone ? '✓' : i + 1}</span>
        <span class="card-title"><b>${esc(ex.name)}</b>
          <span class="meta"><span class="chip ${ex.group}">${GROUPS[ex.group]}</span><span>${esc(ex.equip)}</span></span></span>
        <span class="target">${ex.sets} × ${parseInt(ex.reps) === +ex.reps ? ex.reps : esc(ex.reps.split(' ')[0])}</span>
      </button>
      ${open ? `<div class="card-body">
        <details ${prev ? '' : 'open'}><summary>Як виконувати</summary><div class="how">
          <ol>${ex.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
          <h4>На що звернути увагу</h4><ul>${ex.cues.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
          <h4>Типова помилка</h4><p>${esc(ex.mistake)}</p>
          <h4>Початкова вага</h4><p>${esc(ex.start)} Останні 2 повтори мають бути важкими, але з чистою технікою.</p>
          <p><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Подивитися відео з технікою ↗</a></p>
        </div></details>
        <p class="last">${ex.reps.includes(' ') ? `Повторів: ${esc(ex.reps)}. ` : ''}${prev ? `Минулого разу (${fmtDate(prev.date)}): ${esc(setsText(prev.sets))} (кг×повтори)` : 'Перший раз — запиши вагу, щоб наступного разу мати орієнтир.'}</p>
        <div class="sets">${sets.map((s, n) => `<div class="set">
          <span class="set-n">${n + 1}</span>
          <label class="field"><input type="text" inputmode="decimal" autocomplete="off" aria-label="Вага, підхід ${n + 1}" data-ex="${ex.id}" data-set="${n}" data-f="kg" value="${esc(s.kg ?? '')}" placeholder="0"><span>кг</span></label>
          <label class="field"><input type="text" inputmode="numeric" autocomplete="off" aria-label="Повтори, підхід ${n + 1}" data-ex="${ex.id}" data-set="${n}" data-f="reps" value="${esc(s.reps ?? '')}" placeholder="${parseInt(ex.reps)}"><span>повт.</span></label>
          <button class="check" data-act="check" data-ex="${ex.id}" data-set="${n}" aria-pressed="${s.done}" aria-label="Позначити підхід ${n + 1} виконаним">✓</button>
        </div>`).join('')}</div>
        <div class="set-actions">
          <button class="ghost" data-act="add-set" data-ex="${ex.id}">+ Додати підхід</button>
          ${sets.length > 1 ? `<button class="ghost" data-act="del-set" data-ex="${ex.id}">− Прибрати останній</button>` : ''}
        </div>
      </div>` : ''}
    </section>`;
  }).join('');

  return `<div class="progress"><i style="width:${total ? done / total * 100 : 0}%"></i></div>
    <div class="progress-label"><span>Виконано підходів: ${done} з ${total}</span><span>Відпочинок ${REST_SECONDS} с</span></div>
    ${cards}
    <button class="btn" data-act="finish">Завершити тренування</button>
    ${done ? '<button class="btn secondary" data-act="discard">Скасувати й почати заново</button>' : ''}`;
}

function guideView() {
  return `<h2>Перед початком</h2>
  <div class="prose">
    <h3>Розминка — 5–8 хвилин</h3>
    <ul><li>5 хвилин легкого веслування на тренажері або швидкої ходьби під нахилом.</li>
      <li>10 колових рухів руками в кожен бік, 10 обертів плечима.</li>
      <li>Перед кожною вправою — 1 дуже легкий підхід на 12 повторів, щоб відчути рух. Його не записуй.</li></ul>
    <h3>Як вибрати вагу</h3>
    <p>Починай з меншої ваги, ніж здається. Якщо в усіх підходах робиш верхню межу повторів із чистою технікою — наступного разу додай найменший крок (зазвичай 2,5 кг або 1 кг на гантель). Якщо не дотягуєш до нижньої межі — зменш вагу.</p>
    <h3>Яким має бути повтор</h3>
    <ul><li>Близько 1 секунди на підйом, 2–3 секунди на опускання.</li>
      <li>Видих на зусиллі (тягнеш або тиснеш), вдих на опусканні.</li>
      <li>Повна амплітуда важливіша за більшу вагу.</li></ul>
  </div>
  <h2>Під час тренування</h2>
  <div class="prose">
    <ul><li>Відпочивай 60–90 секунд між підходами — таймер запускається, коли відмічаєш підхід.</li>
      <li>Усе тренування займає приблизно 45–55 хвилин.</li>
      <li>Тренажер зайнятий? Переходь до наступної вправи й повернися пізніше.</li>
      <li>Не знаєш, як налаштувати тренажер? Запитай чергового тренера — саме для цього він у залі.</li>
      <li>Пий воду маленькими ковтками. Протирай обладнання й повертай вагу на місце.</li></ul>
    <h3>Зупинись, якщо</h3>
    <p>Відчуваєш різкий або раптовий біль, біль у суглобі чи запаморочення. Печіння в м’язах і втома — це нормально, різкий біль — ні.</p>
  </div>
  <h2>Після</h2>
  <div class="prose">
    <ul><li>Розтягни найширші м’язи спини, біцепси й трицепси — по 20–30 секунд.</li>
      <li>Руки й спина можуть боліти 1–3 дні. Після першого тренування це нормально і з кожним тижнем минає швидше.</li>
      <li>Поїж страву з білком, добре виспися й зроби перерву щонайменше 48 годин перед наступним тренуванням рук і спини.</li></ul>
  </div>`;
}

function historyView() {
  if (!state.history.length) return `<div class="empty">Тренувань ще немає.<br>Заверши перше — і воно з’явиться тут.</div>`;
  return '<h2>Минулі тренування</h2>' + state.history.map((s, i) => {
    let n = 0, vol = 0;
    const rows = PLAN.map(ex => {
      const done = (s.entries[ex.id] || []).filter(x => x.done);
      if (!done.length) return '';
      for (const d of done) { n++; vol += (parseFloat(d.kg) || 0) * (parseInt(d.reps) || 0); }
      return `<div class="h-row"><span>${esc(ex.name)}</span><span>${esc(setsText(done))}</span></div>`;
    }).join('');
    return `<div class="prose"><h3>${fmtDate(s.date)}</h3>
      <p class="h-stats">${n} ${plural(n, 'підхід', 'підходи', 'підходів')}${s.minutes ? ` · ${s.minutes} хв` : ''} · загальний об’єм ${Math.round(vol).toLocaleString('uk-UA')} кг</p>
      ${rows}<button class="link-danger" data-act="del-session" data-i="${i}">Видалити тренування</button></div>`;
  }).join('');
}

// ---------- rest timer ----------
const timerEl = document.getElementById('timer');
let timerEnd = 0, timerTick = null;
function startTimer(sec) {
  timerEnd = Date.now() + sec * 1000;
  timerEl.hidden = false; timerEl.classList.remove('up');
  document.getElementById('timerLabel').textContent = 'Відпочинок';
  clearInterval(timerTick); timerTick = setInterval(tick, 250); tick();
}
function tick() {
  const left = Math.ceil((timerEnd - Date.now()) / 1000);
  if (left <= 0) {
    clearInterval(timerTick);
    timerEl.classList.add('up');
    document.getElementById('timerLabel').textContent = 'Відпочинок закінчився';
    document.getElementById('timerTime').textContent = 'Вперед!';
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    setTimeout(() => { if (Date.now() >= timerEnd) timerEl.hidden = true; }, 6000);
    return;
  }
  document.getElementById('timerTime').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
}
function stopTimer() { clearInterval(timerTick); timerEl.hidden = true; }

// ---------- events ----------
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.f) return;
  const cur = ensureCurrent();
  cur.entries[t.dataset.ex][+t.dataset.set][t.dataset.f] = t.value.replace(',', '.').trim();
  save();
});

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { tab = tabBtn.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, cur = ensureCurrent(), sets = b.dataset.ex && cur.entries[b.dataset.ex];
  if (act === 'toggle') openId = openId === b.dataset.ex ? '' : b.dataset.ex;
  else if (act === 'check') {
    const s = sets[+b.dataset.set];
    s.done = !s.done;
    if (s.done) {
      if (!cur.startedAt) cur.startedAt = Date.now();
      const ex = PLAN.find(x => x.id === b.dataset.ex);
      if (s.reps === '') s.reps = String(parseInt(ex.reps));
      const next = sets[+b.dataset.set + 1];
      if (next && next.kg === '') next.kg = s.kg;
      const allSetsDone = PLAN.every(x => cur.entries[x.id].every(y => y.done));
      if (!allSetsDone) startTimer(REST_SECONDS);
      if (sets.every(x => x.done)) {
        const nextEx = PLAN.find(x => cur.entries[x.id].some(y => !y.done));
        openId = nextEx ? nextEx.id : '';
      }
    }
  }
  else if (act === 'add-set') sets.push({ kg: sets.length ? sets[sets.length - 1].kg : '', reps: '', done: false });
  else if (act === 'del-set') sets.pop();
  else if (act === 'finish') {
    const any = PLAN.some(x => cur.entries[x.id].some(y => y.done));
    if (!any) { alert('Спершу відміть хоча б один підхід.'); return; }
    if (!confirm('Завершити й зберегти це тренування?')) return;
    state.history.unshift({ date: new Date().toISOString(),
      minutes: cur.startedAt ? Math.max(1, Math.round((Date.now() - cur.startedAt) / 60000)) : 0, entries: cur.entries });
    state.current = null; openId = null; stopTimer(); tab = 'history';
  }
  else if (act === 'discard') {
    if (!confirm('Скасувати все, що записано в цьому тренуванні?')) return;
    state.current = null; openId = null; stopTimer();
  }
  else if (act === 'del-session') {
    if (!confirm('Видалити це тренування з історії?')) return;
    state.history.splice(+b.dataset.i, 1);
  }
  else if (act === 'timer-add') { timerEnd = Math.max(timerEnd, Date.now()) + 15000; startTimer((timerEnd - Date.now()) / 1000); return; }
  else if (act === 'timer-skip') { stopTimer(); return; }
  save(); render();
});

render();
</script>
</body>
</html>
